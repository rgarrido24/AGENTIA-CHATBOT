<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="agentia:demo-url" content="https://agentia.software/demos/biovela">
<title>La Rueda Veladoras — BIOVELA · CDMX</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Fraunces:ital,opsz,wght@0,9..144,400..600;1,9..144,400..600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf7f4;
    --accent: #c17a8a;
    --accent-dark: #a35f6f;
    --text: #2d1a1a;
    --muted: #6b4f52;
    --bubble-user: #c17a8a;
    --bubble-bot: #fff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--cream);
    color: var(--text);
    font-family: 'DM Sans', system-ui, sans-serif;
    font-weight: 400;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    flex-shrink: 0;
    padding: 16px 20px 14px;
    background: rgba(250, 247, 244, 0.95);
    border-bottom: 1px solid rgba(193, 122, 138, 0.25);
    backdrop-filter: blur(10px);
  }
  .header-title {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.25rem;
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--text);
  }
  .header-sub {
    font-size: 0.75rem;
    color: var(--muted);
    margin-top: 4px;
    letter-spacing: 0.04em;
  }
  .chat-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    padding: 0 12px 12px;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 4px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  .chat-messages::-webkit-scrollbar { width: 5px; }
  .chat-messages::-webkit-scrollbar-thumb {
    background: rgba(193, 122, 138, 0.35);
    border-radius: 4px;
  }
  .msg { max-width: 88%; animation: msgIn 0.28s ease both; }
  .msg.bot { align-self: flex-start; }
  .msg.user { align-self: flex-end; }
  .msg-bubble {
    padding: 12px 16px;
    border-radius: 16px;
    font-size: 0.9rem;
    line-height: 1.55;
  }
  .msg.bot .msg-bubble {
    background: var(--bubble-bot);
    color: var(--text);
    border-radius: 6px 18px 18px 18px;
    box-shadow: 0 2px 12px rgba(45, 26, 26, 0.06);
    border: 1px solid rgba(193, 122, 138, 0.12);
  }
  .msg.user .msg-bubble {
    background: var(--bubble-user);
    color: #fff;
    border-radius: 18px 18px 6px 18px;
  }
  .msg-time {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 4px;
    padding: 0 6px;
  }
  .msg.user .msg-time { text-align: right; }
  .typing {
    display: flex;
    gap: 5px;
    align-items: center;
    padding: 12px 16px;
    background: var(--bubble-bot);
    border-radius: 6px 18px 18px 18px;
    width: fit-content;
    box-shadow: 0 2px 12px rgba(45, 26, 26, 0.06);
    border: 1px solid rgba(193, 122, 138, 0.12);
  }
  .typing span {
    width: 7px;
    height: 7px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.7;
    animation: bounce 1.3s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.18s; }
  .typing span:nth-child(3) { animation-delay: 0.36s; }
  .chat-suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 4px 10px;
  }
  .suggestion {
    padding: 7px 14px;
    border: 1px solid rgba(193, 122, 138, 0.45);
    border-radius: 999px;
    font-size: 0.72rem;
    cursor: pointer;
    color: var(--accent-dark);
    background: #fff;
    font-family: inherit;
    transition: background 0.2s, color 0.2s, border-color 0.2s;
  }
  .suggestion:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }
  .chat-input-row {
    flex-shrink: 0;
    display: flex;
    gap: 10px;
    padding: 12px 4px 4px;
    border-top: 1px solid rgba(193, 122, 138, 0.2);
    background: var(--cream);
  }
  .chat-input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid rgba(45, 26, 26, 0.12);
    border-radius: 24px;
    font-family: inherit;
    font-size: 0.88rem;
    color: var(--text);
    background: #fff;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .chat-input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(193, 122, 138, 0.18);
  }
  .chat-input::placeholder { color: var(--muted); opacity: 0.85; }
  .chat-send {
    width: 46px;
    height: 46px;
    background: var(--accent);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s, background 0.2s;
    flex-shrink: 0;
  }
  .chat-send:hover {
    background: var(--accent-dark);
    transform: scale(1.04);
  }
  .chat-send svg { width: 18px; height: 18px; fill: #fff; }
  @keyframes msgIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); }
    40% { transform: translateY(-6px); }
  }
</style>
</head>
<body>
<header>
  <div class="header-title">🕯️ La Rueda Veladoras</div>
  <div class="header-sub">Velas artesanales • CDMX</div>
</header>

<div class="chat-wrap">
  <div class="chat-messages" id="chatMessages">
    <div class="msg bot">
      <div class="msg-bubble">¡Hola! 🕯️ Soy tu asistente de La Rueda Veladoras. ¿Buscas aromas, velas corporales o materias primas para hacer tus propias velas?</div>
      <div class="msg-time">Ahora</div>
    </div>
  </div>

  <div class="chat-suggestions" id="suggestions">
    <button type="button" class="suggestion" onclick="sendSuggestion(this)">Aromas 50 ml</button>
    <button type="button" class="suggestion" onclick="sendSuggestion(this)">Velas corporales BIOVELA</button>
    <button type="button" class="suggestion" onclick="sendSuggestion(this)">Ceras y parafinas</button>
    <button type="button" class="suggestion" onclick="sendSuggestion(this)">¿Hacen envíos?</button>
  </div>

  <div class="chat-input-row">
    <input class="chat-input" id="chatInput" placeholder="Escribe tu mensaje…" autocomplete="off"
      onkeydown="if(event.key==='Enter')sendMessage()">
    <button type="button" class="chat-send" onclick="sendMessage()" aria-label="Enviar">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
(function () {
  const CLIENT_ID = 'biovela';
  const PAGE_ID = 'biovela-demo-page';

  function getSenderId() {
    const k = 'biovela_demo_sender_v1';
    try {
      let id = sessionStorage.getItem(k);
      if (!id) {
        id = (typeof crypto !== 'undefined' && crypto.randomUUID)
          ? crypto.randomUUID()
          : 'demo_' + Date.now() + '_' + Math.random().toString(36).slice(2, 12);
        sessionStorage.setItem(k, id);
      }
      return id;
    } catch (e) {
      return 'demo_' + Date.now();
    }
  }

  function addMessage(text, role) {
    const msgs = document.getElementById('chatMessages');
    const now = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    const safe = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    div.innerHTML = '<div class="msg-bubble">' + safe.replace(/\n/g, '<br>') + '</div><div class="msg-time">' + now + '</div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    const msgs = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg bot';
    div.id = 'typingIndicator';
    div.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    const t = document.getElementById('typingIndicator');
    if (t) t.remove();
  }

  async function callChat(userMessage) {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        clientId: CLIENT_ID,
        platform: 'whatsapp',
        entryType: 'dm',
        message: userMessage,
        senderId: getSenderId(),
        pageId: PAGE_ID,
        senderName: 'Demo La Rueda Veladoras',
      }),
    });
    const data = await res.json().catch(function () { return {}; });
    if (!res.ok) {
      var err = data.error || data.message || ('HTTP ' + res.status);
      throw new Error(err);
    }
    if (data.botPaused) {
      return 'El asistente está pausado en este momento. Escríbenos por WhatsApp: +52 55 3448 9552';
    }
    var reply = typeof data.reply === 'string' ? data.reply : '';
    if (!reply.trim()) {
      return 'No hubo respuesta. Intenta de nuevo o escribe al WhatsApp +52 55 3448 9552';
    }
    return reply;
  }

  window.sendMessage = async function () {
    var input = document.getElementById('chatInput');
    var text = (input.value || '').trim();
    if (!text) return;
    input.value = '';
    var sug = document.getElementById('suggestions');
    if (sug) sug.innerHTML = '';
    addMessage(text, 'user');
    showTyping();
    try {
      var reply = await callChat(text);
      hideTyping();
      addMessage(reply, 'bot');
    } catch (e) {
      hideTyping();
      var msg = (e && e.message) ? e.message : String(e);
      addMessage(
        'No pude conectar con el asistente (' + msg + '). ' +
        'Si aún no cargaste la config en MongoDB, ejecuta: npm run update:biovela. ' +
        'WhatsApp: +52 55 3448 9552',
        'bot'
      );
    }
  };

  window.sendSuggestion = function (btn) {
    document.getElementById('chatInput').value = btn.textContent;
    document.getElementById('suggestions').innerHTML = '';
    window.sendMessage();
  };
})();
</script>
</body>
</html>
