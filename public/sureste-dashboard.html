<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ventas — Región Sureste</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');

:root {
  --bg: #0b0e14;
  --surface: #13161e;
  --surface2: #1a1e28;
  --border: rgba(255,255,255,0.06);
  --accent: #3b82f6;
  --accent2: #8b5cf6;
  --green: #10b981;
  --amber: #f59e0b;
  --red: #ef4444;
  --text: #f1f5f9;
  --dim: #64748b;
  --dim2: #94a3b8;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

/* ── HEADER ── */
.header {
  border-bottom: 1px solid var(--border);
  padding: 20px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  background: rgba(11,14,20,0.95);
  backdrop-filter: blur(12px);
  z-index: 100;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header-badge {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px;
}

.header-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text);
}

.header-sub {
  font-size: 12px;
  color: var(--dim);
  margin-top: 2px;
  font-family: 'DM Mono', monospace;
}

.header-stats {
  display: flex;
  gap: 24px;
  align-items: center;
}

.hstat {
  text-align: right;
}

.hstat-num {
  font-family: 'DM Mono', monospace;
  font-size: 20px;
  font-weight: 500;
  color: var(--accent);
}

.hstat-label {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 0.5px;
}

/* ── MAIN LAYOUT ── */
.layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: calc(100vh - 73px);
}

/* ── SIDEBAR ── */
.sidebar {
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 16px 0;
}

.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-track { background: transparent; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

.sidebar-search {
  padding: 0 16px 12px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.search-input {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 12px 8px 32px;
  color: var(--text);
  font-size: 13px;
  font-family: 'DM Sans', sans-serif;
  outline: none;
  position: relative;
}

.search-wrap {
  position: relative;
}

.search-icon {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--dim);
  font-size: 13px;
  pointer-events: none;
}

.plaza-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  cursor: pointer;
  border-radius: 0;
  transition: background 0.15s;
  border-left: 2px solid transparent;
}

.plaza-item:hover {
  background: var(--surface);
}

.plaza-item.active {
  background: rgba(59,130,246,0.08);
  border-left-color: var(--accent);
}

.plaza-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--dim2);
}

.plaza-item.active .plaza-name {
  color: var(--text);
}

.plaza-count {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  font-weight: 500;
  background: var(--surface2);
  padding: 2px 8px;
  border-radius: 20px;
  color: var(--dim);
}

.plaza-item.active .plaza-count {
  background: rgba(59,130,246,0.15);
  color: var(--accent);
}

/* ── MAIN CONTENT ── */
.main {
  overflow-y: auto;
  padding: 28px 32px;
}

.main::-webkit-scrollbar { width: 4px; }
.main::-webkit-scrollbar-track { background: transparent; }
.main::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ── PLAZA HEADER ── */
.plaza-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 28px;
}

.plaza-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.5px;
}

.plaza-total-badge {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  padding: 6px 16px;
  border-radius: 24px;
  font-family: 'DM Mono', monospace;
  font-size: 14px;
  font-weight: 500;
}

/* ── CARDS ROW ── */
.cards-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 28px;
}

.kpi-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px;
  position: relative;
  overflow: hidden;
}

.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  opacity: 0.6;
}

.kpi-label {
  font-size: 11px;
  color: var(--dim);
  letter-spacing: 1px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.kpi-value {
  font-family: 'DM Mono', monospace;
  font-size: 32px;
  font-weight: 500;
  color: var(--text);
  line-height: 1;
}

.kpi-sub {
  font-size: 11px;
  color: var(--dim);
  margin-top: 6px;
}

/* ── GRID ── */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}

.panel {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}

.panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.panel-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--dim2);
  letter-spacing: 0.5px;
  text-transform: uppercase;
}

.panel-count {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--dim);
}

.panel-body {
  padding: 16px 20px;
}

/* ── VENDEDOR BARS ── */
.vend-item {
  margin-bottom: 14px;
}

.vend-item:last-child { margin-bottom: 0; }

.vend-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.vend-name {
  font-size: 12px;
  font-weight: 500;
  color: var(--dim2);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.vend-num {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
}

.bar-track {
  height: 6px;
  background: var(--surface2);
  border-radius: 3px;
  overflow: hidden;
}

.bar-fill {
  height: 100%;
  border-radius: 3px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.rank-1 .bar-fill { background: linear-gradient(90deg, #3b82f6, #8b5cf6); }
.rank-2 .bar-fill { background: linear-gradient(90deg, #06b6d4, #3b82f6); }
.rank-3 .bar-fill { background: linear-gradient(90deg, #10b981, #06b6d4); }
.rank-other .bar-fill { background: var(--surface2); border: 1px solid var(--border); }

/* ── PAQUETES ── */
.paq-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.paq-item:last-child { border-bottom: none; }

.paq-rank {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--dim);
  width: 20px;
  text-align: center;
}

.paq-rank-1 { color: #f59e0b; }
.paq-rank-2 { color: #94a3b8; }
.paq-rank-3 { color: #b45309; }

.paq-name {
  flex: 1;
  font-size: 13px;
  font-weight: 500;
  color: var(--dim2);
}

.paq-bar-wrap {
  width: 100px;
}

.paq-count {
  font-family: 'DM Mono', monospace;
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  min-width: 28px;
  text-align: right;
}

/* ── OVERVIEW ── */
.overview-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
}

.ov-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.ov-card:hover {
  border-color: rgba(59,130,246,0.3);
  transform: translateY(-1px);
}

.ov-card::after {
  content: '';
  position: absolute;
  bottom: 0; left: 0; right: 0;
  height: 3px;
}

.ov-plaza {
  font-size: 12px;
  font-weight: 600;
  color: var(--dim2);
  margin-bottom: 8px;
  letter-spacing: 0.5px;
}

.ov-num {
  font-family: 'DM Mono', monospace;
  font-size: 28px;
  font-weight: 500;
  line-height: 1;
  margin-bottom: 4px;
}

.ov-paq {
  font-size: 10px;
  color: var(--dim);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tier-high .ov-num { color: #3b82f6; }
.tier-high::after { background: #3b82f6; }
.tier-mid .ov-num { color: #8b5cf6; }
.tier-mid::after { background: #8b5cf6; }
.tier-low .ov-num { color: #10b981; }
.tier-low::after { background: #10b981; }
.tier-micro .ov-num { color: var(--dim2); }
.tier-micro::after { background: var(--surface2); }

/* ── VIEW TOGGLE ── */
.view-toggle {
  display: flex;
  gap: 8px;
  margin-bottom: 24px;
}

.vtbtn {
  padding: 7px 16px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--dim);
  font-family: 'DM Sans', sans-serif;
  transition: all 0.2s;
}

.vtbtn.active, .vtbtn:hover {
  background: var(--surface2);
  color: var(--text);
  border-color: rgba(255,255,255,0.12);
}

.vtbtn.active {
  background: rgba(59,130,246,0.1);
  color: var(--accent);
  border-color: rgba(59,130,246,0.25);
}

/* ── EMPTY ── */
.empty {
  padding: 32px;
  text-align: center;
  color: var(--dim);
  font-size: 13px;
}

/* ── RESPONSIVE ── */
@media (max-width: 900px) {
  .layout { grid-template-columns: 1fr; height: auto; }
  .sidebar { display: none; }
  .content-grid { grid-template-columns: 1fr; }
  .cards-row { grid-template-columns: repeat(2, 1fr); }
  .header-stats { display: none; }
}
</style>
</head>

const PLAZAS = Object.keys(DATA);
let currentPlaza = null;
let currentView = 'plaza';

function getTier(n) {
  if (n >= 80) return 'tier-high';
  if (n >= 30) return 'tier-mid';
  if (n >= 10) return 'tier-low';
  return 'tier-micro';
}

function shortName(name) {
  const parts = name.split(' ');
  if (parts.length <= 3) return name;
  return parts.slice(0,3).join(' ') + '…';
}

function buildSidebar(filter = '') {
  const list = document.getElementById('plazaList');
  list.innerHTML = '';
  PLAZAS.filter(p => p.toLowerCase().includes(filter.toLowerCase())).forEach(plaza => {
    const d = DATA[plaza];
    const el = document.createElement('div');
    el.className = 'plaza-item' + (plaza === currentPlaza ? ' active' : '');
    el.innerHTML = `<span class="plaza-name">${plaza}</span><span class="plaza-count">${d.total}</span>`;
    el.onclick = () => selectPlaza(plaza);
    list.appendChild(el);
  });
}

function filterPlazas(val) {
  buildSidebar(val);
}

function selectPlaza(plaza) {
  currentPlaza = plaza;
  currentView = 'plaza';
  buildSidebar(document.getElementById('searchInput').value);
  renderMain();
}

function renderMain() {
  const main = document.getElementById('mainContent');

  if (!currentPlaza) {
    renderOverview();
    return;
  }

  const d = DATA[currentPlaza];
  const sorted = [...d.vendedores].sort((a,b) => b[1]-a[1]);
  const maxVend = sorted.length ? sorted[0][1] : 1;
  const maxPaq = d.paquetes.length ? d.paquetes[0][1] : 1;
  const topVend = sorted[0] ? sorted[0][0] : '—';
  const topPaq = d.paquetes[0] ? d.paquetes[0][0] : '—';
  const vendCount = sorted.length;

  main.innerHTML = `
    <div class="plaza-header">
      <div>
        <div class="plaza-title">${currentPlaza}</div>
      </div>
      <div class="plaza-total-badge">${d.total} ventas</div>
    </div>

    <div class="cards-row">
      <div class="kpi-card">
        <div class="kpi-label">Total Ventas</div>
        <div class="kpi-value">${d.total}</div>
        <div class="kpi-sub">${vendCount} vendedor${vendCount !== 1 ? 'es' : ''} activo${vendCount !== 1 ? 's' : ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Líder de Ventas</div>
        <div class="kpi-value" style="font-size:18px;line-height:1.3">${shortName(topVend)}</div>
        <div class="kpi-sub">${sorted[0] ? sorted[0][1] + ' ventas' : '—'}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Paquete Top</div>
        <div class="kpi-value" style="font-size:14px;line-height:1.4">${topPaq}</div>
        <div class="kpi-sub">${d.paquetes[0] ? d.paquetes[0][1] + ' ventas' : '—'}</div>
      </div>
    </div>

    <div class="content-grid">
      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Vendedores</span>
          <span class="panel-count">${vendCount} activos</span>
        </div>
        <div class="panel-body">
          ${sorted.length === 0 ? '<div class="empty">Sin datos de vendedor</div>' :
            sorted.map((v, i) => `
              <div class="vend-item rank-${i < 3 ? i+1 : 'other'}">
                <div class="vend-meta">
                  <span class="vend-name" title="${v[0]}">${shortName(v[0])}</span>
                  <span class="vend-num">${v[1]}</span>
                </div>
                <div class="bar-track">
                  <div class="bar-fill" style="width:${Math.round(v[1]/maxVend*100)}%"></div>
                </div>
              </div>`).join('')
          }
        </div>
      </div>

      <div class="panel">
        <div class="panel-header">
          <span class="panel-title">Paquetes más vendidos</span>
          <span class="panel-count">Top ${d.paquetes.length}</span>
        </div>
        <div class="panel-body">
          ${d.paquetes.length === 0 ? '<div class="empty">Sin datos de paquete</div>' :
            d.paquetes.map((p, i) => `
              <div class="paq-item">
                <span class="paq-rank paq-rank-${i+1}">${i+1}</span>
                <span class="paq-name" title="${p[0]}">${p[0]}</span>
                <div class="paq-bar-wrap">
                  <div class="bar-track">
                    <div class="bar-fill rank-${i < 3 ? i+1 : 'other'}" style="width:${Math.round(p[1]/maxPaq*100)}%"></div>
                  </div>
                </div>
                <span class="paq-count">${p[1]}</span>
              </div>`).join('')
          }
        </div>
      </div>
    </div>

    <div style="margin-top:16px">
      <button class="vtbtn" onclick="currentPlaza=null;renderMain()" style="font-size:11px">← Ver todas las plazas</button>
    </div>
  `;
}

function renderOverview() {
  const main = document.getElementById('mainContent');
  main.innerHTML = `
    <div class="plaza-header">
      <div>
        <div class="plaza-title">Resumen Regional</div>
      </div>
      <div class="plaza-total-badge">969 ventas totales</div>
    </div>
    <div class="cards-row">
      <div class="kpi-card">
        <div class="kpi-label">Total Ventas</div>
        <div class="kpi-value">969</div>
        <div class="kpi-sub">33 plazas activas</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Plaza Líder</div>
        <div class="kpi-value" style="font-size:18px">Coatzacoalcos</div>
        <div class="kpi-sub">207 ventas · 21.4%</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Paquete Global Top</div>
        <div class="kpi-value" style="font-size:14px">IZZI 60 MEGAS</div>
        <div class="kpi-sub">256 ventas · 26.4%</div>
      </div>
    </div>
    <p style="font-size:12px;color:var(--dim);margin-bottom:16px">Haz clic en una plaza para ver el detalle de vendedores y paquetes</p>
    <div class="overview-grid">
      ${PLAZAS.map(plaza => {
        const d = DATA[plaza];
        const topP = d.paquetes[0] ? d.paquetes[0][0] : '—';
        return `
          <div class="ov-card ${getTier(d.total)}" onclick="selectPlaza('${plaza}')">
            <div class="ov-plaza">${plaza}</div>
            <div class="ov-num">${d.total}</div>
            <div class="ov-paq">${topP}</div>
          </div>`;
      }).join('')}
    </div>
  `;
}

// Init
buildSidebar();
renderOverview();
</script>
