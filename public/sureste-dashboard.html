<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard Ventas — Región Sureste</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&display=swap');
:root{--bg:#0b0e14;--surface:#13161e;--surface2:#1a1e28;--border:rgba(255,255,255,0.06);--accent:#3b82f6;--accent2:#8b5cf6;--green:#10b981;--amber:#f59e0b;--text:#f1f5f9;--dim:#64748b;--dim2:#94a3b8}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.header{border-bottom:1px solid var(--border);padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:rgba(11,14,20,.95);backdrop-filter:blur(12px);z-index:100}
.header-left{display:flex;align-items:center;gap:16px}
.header-badge{background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:8px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.header-title{font-size:16px;font-weight:600}
.header-sub{font-size:12px;color:var(--dim);margin-top:2px;font-family:'DM Mono',monospace}
.header-stats{display:flex;gap:24px;align-items:center}
.hstat{text-align:right}
.hstat-num{font-family:'DM Mono',monospace;font-size:20px;font-weight:500;color:var(--accent)}
.hstat-label{font-size:11px;color:var(--dim);letter-spacing:.5px}
.layout{display:grid;grid-template-columns:280px 1fr;height:calc(100vh - 73px)}
.sidebar{border-right:1px solid var(--border);overflow-y:auto;padding:16px 0}
.sidebar::-webkit-scrollbar{width:4px}
.sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.sidebar-search{padding:0 16px 12px;border-bottom:1px solid var(--border);margin-bottom:8px}
.search-wrap{position:relative}
.search-input{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:8px;padding:8px 12px 8px 32px;color:var(--text);font-size:13px;font-family:'DM Sans',sans-serif;outline:none}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);font-size:13px;pointer-events:none}
.plaza-item{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .15s}
.plaza-item:hover{background:var(--surface)}
.plaza-item.active{background:rgba(59,130,246,.08);border-left-color:var(--accent)}
.plaza-name{font-size:13px;font-weight:500;color:var(--dim2)}
.plaza-item.active .plaza-name{color:var(--text)}
.plaza-count{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;background:var(--surface2);padding:2px 8px;border-radius:20px;color:var(--dim)}
.plaza-item.active .plaza-count{background:rgba(59,130,246,.15);color:var(--accent)}
.main{overflow-y:auto;padding:28px 32px}
.main::-webkit-scrollbar{width:4px}
.main::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.plaza-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:28px}
.plaza-title{font-size:28px;font-weight:700;letter-spacing:-.5px}
.plaza-total-badge{background:linear-gradient(135deg,var(--accent),var(--accent2));padding:6px 16px;border-radius:24px;font-family:'DM Mono',monospace;font-size:14px;font-weight:500}
.supervisor-tag{display:inline-flex;align-items:center;gap:6px;background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);color:#f59e0b;font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;margin-top:8px;letter-spacing:.5px;text-transform:uppercase}
.plazas-tag{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.plaza-chip{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:10px;color:var(--dim);letter-spacing:.5px}
.cards-row{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;position:relative;overflow:hidden}
.kpi-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));opacity:.6}
.kpi-label{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px}
.kpi-value{font-family:'DM Mono',monospace;font-size:32px;font-weight:500;line-height:1}
.kpi-sub{font-size:11px;color:var(--dim);margin-top:6px}
.content-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.panel-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.panel-title{font-size:13px;font-weight:600;color:var(--dim2);letter-spacing:.5px;text-transform:uppercase}
.panel-count{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim)}
.panel-body{padding:16px 20px}
.vend-item{margin-bottom:14px}
.vend-item:last-child{margin-bottom:0}
.vend-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.vend-name{font-size:12px;font-weight:500;color:var(--dim2);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vend-num{font-family:'DM Mono',monospace;font-size:12px;color:var(--text);font-weight:500}
.bar-track{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.4,0,.2,1)}
.rank-1 .bar-fill{background:linear-gradient(90deg,#3b82f6,#8b5cf6)}
.rank-2 .bar-fill{background:linear-gradient(90deg,#06b6d4,#3b82f6)}
.rank-3 .bar-fill{background:linear-gradient(90deg,#10b981,#06b6d4)}
.rank-other .bar-fill{background:rgba(100,116,139,.3)}
.paq-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.paq-item:last-child{border-bottom:none}
.paq-rank{font-family:'DM Mono',monospace;font-size:11px;color:var(--dim);width:20px;text-align:center}
.paq-rank-1{color:#f59e0b}.paq-rank-2{color:#94a3b8}.paq-rank-3{color:#b45309}
.paq-name{flex:1;font-size:13px;font-weight:500;color:var(--dim2)}
.paq-bar-wrap{width:100px}
.paq-count{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:var(--text);min-width:28px;text-align:right}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.ov-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.ov-card:hover{border-color:rgba(59,130,246,.3);transform:translateY(-1px)}
.ov-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px}
.ov-plaza{font-size:12px;font-weight:600;color:var(--dim2);margin-bottom:4px;letter-spacing:.5px}
.ov-super{font-size:10px;color:#f59e0b;margin-bottom:6px}
.ov-num{font-family:'DM Mono',monospace;font-size:28px;font-weight:500;line-height:1;margin-bottom:4px}
.ov-paq{font-size:10px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tier-high .ov-num{color:#3b82f6}.tier-high::after{background:#3b82f6}
.tier-mid .ov-num{color:#8b5cf6}.tier-mid::after{background:#8b5cf6}
.tier-low .ov-num{color:#10b981}.tier-low::after{background:#10b981}
.tier-micro .ov-num{color:var(--dim2)}.tier-micro::after{background:var(--surface2)}
.pct-badge{font-family:'DM Mono',monospace;font-size:11px;color:var(--green);background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.2);padding:1px 7px;border-radius:10px;margin-left:6px}
.vtbtn{padding:7px 16px;border-radius:8px;font-size:12px;font-weight:500;cursor:pointer;border:1px solid var(--border);background:transparent;color:var(--dim);font-family:'DM Sans',sans-serif;transition:all .2s}
.vtbtn:hover{background:var(--surface2);color:var(--text)}
.empty{padding:32px;text-align:center;color:var(--dim);font-size:13px}
@media(max-width:900px){.layout{grid-template-columns:1fr;height:auto}.sidebar{display:none}.content-grid{grid-template-columns:1fr}.cards-row{grid-template-columns:repeat(2,1fr)}.header-stats{display:none}}
</style>
</head>
<body>
<div class="header">
  <div class="header-left">
    <div class="header-badge">S</div>
    <div>
      <div class="header-title">Dashboard Ventas — Sureste</div>

  </div>

<script>
const TOTAL_REGIONAL = 967;
const DATA={"VERACRUZ SUR":{"supervisor":"OBED DE JESUS SEGURA","plazas":["COATZACOALCOS","MINATITLAN","COSOLEACAQUE"],"total":247,"vendedores":[["ULISES JIMENEZ CHAVEZ",101],["HILARIO CAMPOS HERNANDEZ",37],["KARLA DOLORES GRIJALVA HERNANDEZ",17],["FRANCISCO JAVIER LOPEZ HERNANDEZ",12],["SALVADOR BERNAL LORENZO",10],["MILDRI YULISSA ROJAS VILLALOBOS",5],["DMJA SA DE CV",3],["EAGLE CONSTRUMEDICIONES SA DE CV",1],["ARTUPER SA DE CV",1],["GRUPO BENJES SA DE CV",1],["MARTIN GARCIA CARRASCO",1]],"paquetes":[["IZZI 60 MEGAS",80],["IZZI 60 MEGAS + IZZI TV HD",42],["IZZI 100 MEGAS",26],["IZZI 100 MEGAS + IZZI TV HD",17],["IZZI 80 MEGAS",7]]},"YUCATAN":{"supervisor":null,"plazas":["PROGRESO","MERIDA","BUCTZOTZ","TIZIMIN","ESPITA","IZAMAL","TEMAX"],"total":125,"vendedores":[["OSCAR FERNANDO ESTRADA ESCALANTE",61],["HILARIO CAMPOS HERNANDEZ",10],["GERARDO JAREDH SANCHEZ FLORES",6],["RICARDO ZERTUCHE FLORES",3],["LEIDY DANIELA VARGAS NARVAEZ",2],["ARELY JOSEFINA CARO PASOS",1],["ARTUPER SA DE CV",1],["COMUNICACION R CREATIVA SAS DE CV",1],["GENY ALEJANDRA ARZAPALO OXTE",1],["EAGLE CONSTRUMEDICIONES SA DE CV",1],["DANIEL ALLENDE ROMAN",1],["JOSE JULIAN GONZALEZ ROMERO",1],["JOSE FRANCISCO DE LA CRUZ HERRERA LARA",1],["HUGO CESAR RODRIGUEZ TORRES",1],["LUIS ALBERTO CISNEROS MEX",1],["MARIO ENRIQUE ZALDIVAR ALBORNOZ",1],["MANUEL JESUS HUCHIM COCOM",1],["RICARDO ADONAY LOEZA ALONSO",1],["YAMILE YOLANDA SANDOVAL CHIQUINI",1]],"paquetes":[["IZZI 60 MEGAS",50],["IZZI 60 MEGAS + IZZI TV HD",27],["IZZI 100 MEGAS",5],["IZZI 100 MEGAS + IZZI TV HD",5],["IZZI 80 MEGAS + IZZI TV HD",4]]},"CANCUN":{"supervisor":null,"plazas":["CANCUN"],"total":85,"vendedores":[["JUAN CARLOS SOSA GATICA",19],["JOSE EDUARDO MARTIN EUAN",12],["EAGLE CONSTRUMEDICIONES SA DE CV",12],["GRUPO BENJES SA DE CV",8],["HILARIO CAMPOS HERNANDEZ",5],["DMJA SA DE CV",1],["ARTUPER SA DE CV",1],["EBEN EZER HUIZAR VALENCIA",1],["ELDER ALFONSO PROT GARCIA",1],["JESSICA MARLENE VAZQUEZ MELO",1],["MARIA DEL CARMEN FELIPE CASTAÑE CAMPOS HERNANDEZ",2],["DMJA SA DE CV",1],["EBEN EZER HUIZAR VALENCIA",1]],"paquetes":[["IZZI 60 MEGAS",10],["IZZI 80 MEGAS + IZZI TV HD",6],["IZZI 100 MEGAS + IZZI TV HD",2],["IZZI 60 MEGAS + IZZI TV HD",1],["IZZI TV +",1]]},"ORIZABA":{"supervisor":null,"plazas":["ORIZABA"],"total":27,"vendedores":[["COMUNICACION R CREATIVA SAS DE CV",7],["EAGLE CONSTRUMEDICIONES SA DE CV",7],["HILARIO CAMPOS HERNANDEZ",3],["DMJA SA DE CV",1]],"paquetes":[["IZZI 60 MEGAS",6],["IZZI 60 MEGAS + IZZI TV HD",4],["IZZI 100 MEGAS + IZZI TV HD",3],["IZZI 80 MEGAS",3],["IZZI 80 MEGAS + IZZI TV HD",1]]},"PLAYA DEL CARMEN":{"supervisor":null,"plazas":["PLAYA DEL CARMEN"],"total":21,"vendedores":[["EAGLE CONSTRUMEDICIONES SA DE CV",4],["HILARIO CAMPOS HERNANDEZ",3],["JUAN CARLOS SOSA GATICA",3],["JOSE EDUARDO MARTIN EUAN",2],["DMJA SA DE CV",1],["MARIA DEL CARMEN FELIPE CASTAÑEDA",1],["NELSON COBOS COBOS",1]],"paquetes":[["IZZI 60 MEGAS",6],["IZZI 100 MEGAS + IZZI TV HD",3],["IZZI 150 MEGAS",2],["IZZI 80 MEGAS",2],["IZZI 60 MEGAS + IZZI TV HD",1]]},"CHOLULA":{"supervisor":null,"plazas":["CHOLULA"],"total":17,"vendedores":[["ISAIAS SERGIO PALESTINO VAZQUEZ",5],["HILARIO CAMPOS HERNANDEZ",2],["JONATHAN ULISES SOLANO DAVILA",2],["DMJA SA DE CV",1],["EAGLE CONSTRUMEDICIONES SA DE CV",1],["STAALVERKOOP SA DE CV",1]],"paquetes":[["IZZI 60 MEGAS",6],["IZZI TV +",2],["IZZI 150 MEGAS + IZZI TV HD",1],["IZZI 100 MEGAS + IZZI TV HD",1],["IZZI 60 MEGAS + IZZI TV HD",1]]},"TLAXCALA":{"supervisor":"ELVIA DAVILA","plazas":[],"total":84,"vendedores":[],"paquetes":[]},"CAMPECHE":{"supervisor":null,"plazas":["CAMPECHE"],"total":2,"vendedores":[],"paquetes":[]},"CD DEL CARMEN":{"supervisor":null,"plazas":["CD DEL CARMEN"],"total":1,"vendedores":[],"paquetes":[]},"HUAMANTLA":{"supervisor":null,"plazas":["HUAMANTLA"],"total":3,"vendedores":[["GRUPO BENJES SA DE CV",1],["JONATHAN ULISES SOLANO DAVILA",1]],"paquetes":[["WIZZ 40 + IZZI TV +",1],["WIZZ 60",1]]},"NANCHITAL":{"supervisor":null,"plazas":["NANCHITAL"],"to const GROUPS=Object.keys(DATA);
function getTier(n){return n>=100?'tier-high':n>=40?'tier-mid':n>=10?'tier-low':'tier-micro'}
function shortName(n){const p=n.split(' ');return p.length<=3?n:p.slice(0,3).join(' ')+'…'}
let current=null;

function buildSidebar(filter=''){
  const list=document.getElementById('groupList');
  list.innerHTML='';
  GROUPS.filter(g=>g.toLowerCase().includes(filter.toLowerCase())).forEach(g=>{
    const d=DATA[g];
    const el=document.createElement('div');
    el.className='plaza-item'+(g===current?' active':'');
    el.innerHTML=`<div><div class="plaza-name">${g}</div>${d.supervisor?`<div style="font-size:10px;color:#f59e0b;margin-top:2px">${shortName(d.supervisor)}</div>`:''}</div><span class="plaza-count">${d.total}</span>`;
    el.onclick=()=>select(g);
    list.appendChild(el);
  });
}

function filterGroups(val){buildSidebar(val)}
function select(g){current=g;buildSidebar(document.getElementById('searchInput').value);renderDetail()}

function renderDetail(){
  const d=DATA[current];
  const sorted=[...d.vendedores].sort((a,b)=>b[1]-a[1]);
  const maxV=sorted.length?sorted[0][1]:1;
  const maxP=d.paquetes.length?d.paquetes[0][1]:1;
  document.getElementById('mainContent').innerHTML=`
    <div class="plaza-header">
      <div>
        <div class="plaza-title">${current}</div>
        ${d.supervisor?`<div class="supervisor-tag">👤 ${d.supervisor}</div>`:''}
        ${d.plazas.length?`<div class="plazas-tag">${d.plazas.map(p=>`<span class="plaza-chip">${p}</span>`).join('')}</div>`:'<div style="margin-top:8px;font-size:11px;color:var(--dim)">Detalle de plazas pendiente</div>'}
      </div>
      <div class="plaza-total-badge">${d.total} ventas</div>
    </div>
    <div class="cards-row">
      <div class="kpi-card"><div class="kpi-label">Total Ventas</div><div class="kpi-value">${d.total}</div><div class="kpi-sub">${sorted.length?sorted.length+' vendedor'+(sorted.length!==1?'es':''):'Detalle pendiente'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Líder de Ventas</div><div class="kpi-value" style="font-size:18px;line-height:1.3">${sorted[0]?shortName(sorted[0][0]):'—'}</div><div class="kpi-sub">${sorted[0]?sorted[0][1]+' ventas':'Detalle pendiente'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Paquete Top</div><div class="kpi-value" style="font-size:14px;line-height:1.4">${d.paquetes[0]?d.paquetes[0][0]:'—'}</div><div class="kpi-sub">${d.paquetes[0]?d.paquetes[0][1]+' ventas':'Detalle pendiente'}</div></div>
    </div>
    <div class="content-grid">
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Vendedores</span><span class="panel-count">${sorted.length} activos</span></div>
        <div class="panel-body">${sorted.length===0?'<div class="empty">Detalle pendiente</div>':sorted.map((v,i)=>`<div class="vend-item rank-${i<3?i+1:'other'}"><div class="vend-meta"><span class="vend-name" title="${v[0]}">${shortName(v[0])}</span><span class="vend-num">${v[1]}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round(v[1]/maxV*100)}%"></div></div></div>`).join('')}</div>
      </div>
      <div class="panel">
        <div class="panel-header"><span class="panel-title">Paquetes más vendidos</span><span class="panel-count">Top ${d.paquetes.length}</span></div>
        <div class="panel-body">${d.paquetes.length===0?'<div class="empty">Detalle pendiente</div>':d.paquetes.map((p,i)=>`<div class="paq-item"><span class="paq-rank paq-rank-${i+1}">${i+1}</span><span class="paq-name" title="${p[0]}">${p[0]}</span><div class="paq-bar-wrap"><div class="bar-track"><div class="bar-fill rank-${i<3?i+1:'other'}" style="width:${Math.round(p[1]/maxP*100)}%"></div></div></div><span class="paq-count">${p[1]}</span></div>`).join('')}</div>
      </div>
    </div>
    <div style="margin-top:16px"><button class="vtbtn" onclick="current=null;renderOverview()">← Ver resumen regional</button></div>`;
}

function renderOverview(){
  buildSidebar(document.getElementById('searchInput').value);
  const top5=[["ULISES JIMENEZ CHAVEZ",102,10.5],["HILARIO CAMPOS HERNANDEZ",79,8.2],["GRUPO BENJES SA DE CV",67,6.9],["OSCAR FERNANDO ESTRADA ESCALANTE",61,6.3],["EAGLE CONSTRUMEDICIONES SA DE CV",50,5.2]];
  document.getElementById('mainContent').innerHTML=`
    <div class="plaza-header">
      <div><div class="plaza-title">Resumen Regional</div></div>
      <div class="plaza-total-badge">967 ventas totales</div>
    </div>
    <div class="cards-row">
      <div class="kpi-card"><div class="kpi-label">Total Ventas</div><div class="kpi-value">967</div><div class="kpi-sub">20 grupos / plazas</div></div>
      <div class="kpi-card"><div class="kpi-label">Grupo Líder</div><div class="kpi-value" style="font-size:18px">Veracruz Sur</div><div class="kpi-sub">247 ventas · Sup: Obed De Jesus</div></div>
      <div class="kpi-card"><div class="kpi-label">Paquete Global Top</div><div class="kpi-value" style="font-size:14px">IZZI 60 MEGAS</div><div class="kpi-sub">Dominante en mayoría de plazas</div></div>
    </div>
    <div class="panel" style="margin-bottom:24px">
      <div class="panel-header"><span class="panel-title">🏆 Top 5 Vendedores — Región</span><span class="panel-count">% participación del total regional</span></div>
      <div class="panel-body">
        ${top5.map((v,i)=>`
          <div class="vend-item rank-${i<3?i+1:'other'}">
            <div class="vend-meta">
              <span class="vend-name" title="${v[0]}">
                <span style="font-family:'DM Mono',monospace;color:var(--dim);margin-right:8px;font-size:11px">#${i+1}</span>
                ${shortName(v[0])}
              </span>
              <span style="display:flex;align-items:center;gap:8px">
                <span class="pct-badge">${v[2]}%</span>
                <span class="vend-num">${v[1]}</span>
              </span>
            </div>
            <div class="bar-track"><div class="bar-fill" style="width:${Math.round(v[1]/102*100)}%"></div></div>
          </div>`).join('')}
      </div>
    </div>
    <p style="font-size:12px;color:var(--dim);margin-bottom:16px">Haz clic en un grupo para ver el detalle</p>
    <div class="overview-grid">
      ${GROUPS.map(g=>{const d=DATA[g];return`<div class="ov-card ${getTier(d.total)}" onclick="select('${g}')"><div class="ov-plaza">${g}</div>${d.supervisor?`<div class="ov-super">👤 ${shortName(d.supervisor)}</div>`:''}<div class="ov-num">${d.total}</div><div class="ov-paq">${d.paquetes[0]?d.paquetes[0][0]:'Detalle pendiente'}</div></div>`}).join('')}
    </div>`;
}

buildSidebar();
renderOverview();
</script>
</body>
</html>
